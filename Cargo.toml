[package]
name = "model-router"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/WyattAu/model-router"
homepage = "https://github.com/WyattAu/model-router"
documentation = "https://docs.rs/model-router"
description = "Cost-aware LLM routing core: per-model pricing tables, USD budget tracking, and task-class routing with fallback chains."
readme = "README.md"
keywords = ["llm", "router", "cost", "budget", "ai"]
categories = ["algorithms", "development-tools"]

[features]
default = []
serde = ["dep:serde"]
# JSON loading for price-table refresh (`PricingTable::from_json` /
# `PricingTable::to_json`). Implies `serde`.
json = ["dep:serde_json", "serde"]
# Optional companion adapter for the `genai` crate: maps genai model
# identifiers (`ModelIden`) to pricing-table entries. The core of this crate
# never depends on genai.
genai = ["dep:genai"]

[dependencies]
thiserror = "2.0"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
genai = { version = "0.7.0-beta", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"
serde_json = "1"
