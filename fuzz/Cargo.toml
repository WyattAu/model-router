[package]
name = "model-router-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
model-router = { path = "..", features = ["json"] }

[[bin]]
name = "fuzz_pricing_json"
path = "fuzz_targets/fuzz_pricing_json.rs"
test = false
doc = false

[[bin]]
name = "fuzz_router_config"
path = "fuzz_targets/fuzz_router_config.rs"
test = false
doc = false
