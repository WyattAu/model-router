# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste unmaintained (not a vulnerability; the derive macro still works).
    # Transitive via genai 0.7.0-beta; paste has no patched release and no
    # in-range upgrade exists (pastey is the drop-in fork upstream).
    # TODO: drop when genai migrates off paste.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
