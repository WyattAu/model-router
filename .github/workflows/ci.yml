name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      tier: c
      all-features: true
      loom: false
      wasm: false
      miri: false

  # Router-seam wire tests (tests/wire_routing.rs): mock OpenAI-compatible
  # providers on loopback via wiremock — routing, failover, timeouts, cost
  # accounting against real HTTP.
  integration:
    name: Integration (wire routing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --test wire_routing

  # Fuzz smoke: 60s per pricing-table/config target. Full runs are
  # local/nightly; this gate catches regressions on the JSON load path early.
  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: pricing JSON smoke (60s)
        run: cargo fuzz run fuzz_pricing_json -- -max_total_time=60 -max_len=8192 -detect_leaks=0
      - name: router config smoke (60s)
        run: cargo fuzz run fuzz_router_config -- -max_total_time=60 -max_len=2048 -detect_leaks=0
